name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for the server integration tests (connection loss, timeouts).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: menuai_test
          POSTGRES_USER: menuai
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U menuai -d menuai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:attribution
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server
        env:
          TEST_DATABASE_URL: postgres://menuai:ci-only-password@localhost:5432/menuai_test
      - run: npm run server:build
      - run: npm audit --omit=dev --audit-level=high
      - name: Shell scripts (deploy, backup, restore)
        run: shellcheck scripts/*.sh
      - name: SBOM (CycloneDX) of runtime dependencies
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'

  docker:
    # Builds the production image and boots the full compose stack (Postgres + ClamAV + API).
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      PUBLIC_URL: https://menu.example.com
    steps:
      - uses: actions/checkout@v4
      # ClamAV downloads its signature database on first start, which takes a few minutes.
      - run: docker compose up -d --build --wait --wait-timeout 600
      - name: Health check through the published localhost port
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/nope | grep -q 404
      - name: Runtime image is minimal and non-root
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          # Only sharp (native) sits next to the bundle; everything else is bundled.
          docker compose exec -T api sh -c 'test -d /app/node_modules/sharp && test ! -d /app/node_modules/fastify'
      - name: Image upload end to end (real ClamAV scan + sharp on Alpine)
        run: |
          set -euo pipefail
          ORIGIN=https://menu.example.com
          TOKEN=$(docker compose exec -T api node dist-server/cli.mjs create-owner ci@example.com CI | grep -o 'token=[A-Za-z0-9_-]*' | cut -d= -f2)
          SESSION=$(curl -fsS -D - -o /dev/null -H "Origin: $ORIGIN" -H 'content-type: application/json' \
            -d "{\"token\":\"$TOKEN\"}" http://127.0.0.1:3000/api/auth/verify | grep -io 'menuai_session=[^;]*')
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > dot.png
          RES=$(curl -fsS -H "Origin: $ORIGIN" -H "Cookie: $SESSION" -H 'content-type: image/png' --data-binary @dot.png http://127.0.0.1:3000/api/uploads)
          echo "$RES"
          URL=$(echo "$RES" | grep -o '/media/[0-9a-f-]*\.webp')
          curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:3000$URL" | grep -q image/webp
          # A renamed non-image is refused before it is even scanned.
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Origin: $ORIGIN" -H "Cookie: $SESSION" -H 'content-type: image/png' --data-binary '<svg/>' http://127.0.0.1:3000/api/uploads)" = 415
      - name: Encrypted backup → data loss → restore round trip
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq age >/dev/null
          age-keygen -o key.txt 2>/dev/null
          export APP_DIR="$PWD" BACKUP_DIR="$PWD/backups" BACKUP_AGE_RECIPIENT="$(grep -o 'age1[a-z0-9]*' key.txt)"
          bash scripts/backup.sh
          ID=$(docker compose exec -T db psql -U menuai -tAc "SELECT id FROM uploads WHERE status = 'clean' LIMIT 1")
          test -n "$ID"
          # Simulate losing the data.
          docker compose exec -T db psql -U menuai -c "DELETE FROM uploads; DELETE FROM users"
          docker compose exec -T api sh -c 'rm -f /var/lib/menuai/uploads/public/*'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/media/$ID.webp")" = 404
          bash scripts/restore.sh backups/menuai-*.tar.age key.txt --yes
          test "$(docker compose exec -T db psql -U menuai -tAc "SELECT count(*) FROM users WHERE email = 'ci@example.com'")" = 1
          curl -fsS -o /dev/null "http://127.0.0.1:3000/media/$ID.webp"
          docker compose exec -T api node dist-server/cli.mjs status
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
